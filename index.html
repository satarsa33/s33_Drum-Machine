<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web Drum Machine V3</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><header><h1>🥁 Web Drum Machine V3</h1><div class="transport"><button id="play">▶</button><button id="stop">■</button><label>BPM <input id="bpm" type="number" min="40" max="240" value="120"></label><label>Swing <input id="swing" type="range" min="0" max="60" value="16"></label><select id="pattern"></select><button id="random">Randomize</button><button id="humanize">Humanize</button><button id="undo">↶</button><button id="redo">↷</button></div></header><main><section class="panel seq"><div id="grid"></div></section><section class="work"><div class="panel"><h2>Track / Sample</h2><select id="track"></select><input id="file" type="file" accept="audio/*"><canvas id="wave"></canvas><label>Pitch <input id="pitch" type="range" min="-12" max="12" value="0"></label><label>Decay <input id="decay" type="range" min="40" max="1500" value="250"></label><label>Filter <input id="filter" type="range" min="300" max="18000" value="18000"></label><label>Volume <input id="volume" type="range" min="0" max="100" value="78"></label><label>Pan <input id="pan" type="range" min="-100" max="100" value="0"></label><label>Send <input id="send" type="range" min="0" max="100" value="20"></label><div class="pair"><button id="mute">MUTE</button><button id="solo">SOLO</button></div></div><div class="panel"><h2>Step Editor</h2><p id="stepLabel">Kick · 1</p><label>Velocity <input id="velocity" type="range" min="0" max="100" value="100"></label><label>Probability <input id="prob" type="range" min="0" max="100" value="100"></label><label>Microtiming <input id="micro" type="range" min="-60" max="60" value="0"></label><h2>FX</h2><label>Reverb <input id="reverb" type="range" min="0" max="100" value="18"></label><label>Delay <input id="delay" type="range" min="0" max="100" value="10"></label><label>Feedback <input id="feedback" type="range" min="0" max="85" value="25"></label><label>Compressor <input id="threshold" type="range" min="-60" max="0" value="-12"></label></div><div class="panel"><h2>Project</h2><label>Master <input id="master" type="range" min="0" max="100" value="85"></label><h3>Pattern Chain</h3><div id="chain"></div><button id="save">Save local</button><button id="load">Load local</button><button id="json">Export JSON</button><button id="midi">Export MIDI</button><button id="wav">Export WAV</button><p id="status">Ready</p></div></section></main><footer>Space = Play/Pause · R = Randomize · Ctrl/Cmd+Z = Undo</footer></div><script type="module" src="app.js"></script></body></html>
